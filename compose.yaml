services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mimit
      POSTGRES_PASSWORD: mimit
      POSTGRES_DB: mimit
    ports:
      - "127.0.0.1:${MIMIT_POSTGRES_PORT:-55439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimit -d mimit"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
